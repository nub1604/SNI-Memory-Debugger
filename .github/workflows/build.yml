name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish sni_viewer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:DebugType=none -o publish/${{ matrix.rid }}

      # tar keeps the executable bit, which zip artifacts lose on macOS/Linux
      - name: Package (macOS/Linux)
        if: runner.os != 'Windows'
        run: tar -czf MemoryDebugger-${{ matrix.rid }}.tar.gz -C publish/${{ matrix.rid }} .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath MemoryDebugger-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v5
        with:
          name: MemoryDebugger-${{ matrix.rid }}
          path: MemoryDebugger-${{ matrix.rid }}.*
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Requires [SNI](https://github.com/alttpo/sni) running locally (port 8191).

            **macOS:** after extracting, run once `xattr -dr com.apple.quarantine sni_viewer` (the build is not notarized), then start with `./sni_viewer`.
            Use `osx-arm64` for Apple Silicon, `osx-x64` for Intel Macs.

            **Linux:** extract and run `./sni_viewer`.
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "$NOTES"
